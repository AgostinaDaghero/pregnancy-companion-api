services:
  postgres:
    image: postgres:17-alpine
    container_name: pregnancy-companion-db
    environment:
      POSTGRES_DB: ${DB_NAME:-pregnancy_companion}
      POSTGRES_USER: ${DB_USER:-pregnancy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pregnancy_dev}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
