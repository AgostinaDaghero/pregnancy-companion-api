spring.application.name=Pregnancy Companion API

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/pregnancy_companion}
spring.datasource.username=${DB_USER:pregnancy}
spring.datasource.password=${DB_PASSWORD:pregnancy_dev}

# Flyway es la única fuente de verdad del esquema; Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
